name: git isolation backend

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Format task PHP
        run: |
          vendor/bin/pint app/Actions/RunCoderTask.php app/Services/GitRepositoryInspector.php app/Services/TaskCommitter.php app/Services/TaskValidator.php app/Services/TaskWorkflow.php tests/Feature/GitTaskIsolationTest.php
          git diff -- app/Actions/RunCoderTask.php app/Services/GitRepositoryInspector.php app/Services/TaskCommitter.php app/Services/TaskValidator.php app/Services/TaskWorkflow.php tests/Feature/GitTaskIsolationTest.php

      - name: Run PHPStan
        run: composer types:check

      - name: Run PHP tests
        run: php artisan test
